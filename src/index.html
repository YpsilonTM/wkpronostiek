<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WK Pronostiek</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 1rem 1.25rem 2rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
    .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.25rem; }

    #top-controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      align-items: center;
    }

    button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-secondary { background: #475569; color: #fff; }
    .btn-ghost {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #334155;
      font-weight: 500;
    }

    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.88rem;
    }
    .stat-item { display: flex; flex-direction: column; gap: 0.15rem; }
    .stat-label { color: #64748b; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-value { font-weight: 600; color: #f1f5f9; }
    .stat-value.muted { color: #64748b; font-weight: 500; }

    .log-section {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #0f172a;
      padding-bottom: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .log-header h2 { font-size: 0.95rem; font-weight: 600; color: #cbd5e1; }
    .log-controls { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .log-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      color: #94a3b8;
      cursor: pointer;
      user-select: none;
    }
    .log-toggle input { accent-color: #3b82f6; }

    .log-box {
      background: #1e293b;
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      height: min(32vh, 280px);
      overflow-y: auto;
      font-family: ui-monospace, monospace;
      font-size: 0.82rem;
      line-height: 1.55;
      border: 1px solid #334155;
    }
    .log-line { padding: 0.08rem 0; word-break: break-word; }
    .log-line.hidden { display: none; }
    .log-line.debug { color: #64748b; }

    #status { font-size: 0.85rem; color: #64748b; }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.85rem;
      color: #cbd5e1;
    }

    #matches {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
      gap: 1rem;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 2.5rem 1rem;
      background: #1e293b;
      border: 1px dashed #334155;
      border-radius: 0.75rem;
      color: #94a3b8;
    }
    .empty-state strong { display: block; color: #e2e8f0; margin-bottom: 0.35rem; font-size: 1rem; }

    .match-card {
      background: #1e293b;
      border-radius: 0.75rem;
      padding: 1.15rem;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      min-height: 168px;
    }
    .match-card.predicting { border-color: #3b82f6; box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.25); }

    .match-header { display: flex; flex-direction: column; gap: 0.45rem; }
    .match-teams { font-weight: 600; font-size: 1.02rem; line-height: 1.25; }
    .match-meta { font-size: 0.78rem; color: #94a3b8; }

    .chip-row { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .chip {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.18rem 0.5rem;
      border-radius: 999px;
      line-height: 1.3;
    }
    .chip-time { background: #334155; color: #cbd5e1; }
    .chip-auto { background: #1e3a5f; color: #93c5fd; }
    .chip-done { background: #14532d; color: #86efac; }
    .chip-loading { background: #422006; color: #fdba74; }

    .match-result {
      font-weight: 600;
      font-size: 0.92rem;
      color: #eab308;
      line-height: 1.25;
    }
    .match-reasoning {
      font-size: 0.82rem;
      color: #94a3b8;
      line-height: 1.45;
      border-left: 2px solid #334155;
      padding-left: 0.65rem;
    }
    .match-reasoning strong { color: #cbd5e1; font-weight: 600; }

    .match-actions {
      margin-top: auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .match-actions-left { flex: 1; min-width: 0; }

    .spinner {
      width: 0.95rem;
      height: 0.95rem;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-msg {
      font-size: 0.78rem;
      color: #fdba74;
      margin-top: 0.35rem;
    }

    @media (max-width: 640px) {
      body { padding: 0.75rem 0.85rem 1.5rem; }
      .log-section {
        margin-left: -0.85rem;
        margin-right: -0.85rem;
        padding: 0.5rem 0.85rem 0.75rem;
        border-bottom: 1px solid #1e293b;
      }
      .log-box { height: min(28vh, 220px); }
    }
  </style>
</head>
<body>
  <h1>⚽ WK Pronostiek</h1>
  <p class="subtitle">Automatische run 1 uur voor aanvang van elke wedstrijd</p>

  <div id="top-controls">
    <button class="btn-secondary" id="auth-btn" type="button">🔑 Auth vernieuwen</button>
    <p id="status">Verbinden met log stream...</p>
  </div>

  <div class="stats-bar" id="accuracy-stats">
    <div class="stat-item">
      <span class="stat-label">Exacte score</span>
      <span class="stat-value muted" id="stat-exact">—</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Juiste uitslag</span>
      <span class="stat-value muted" id="stat-outcome">—</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Geëvalueerd</span>
      <span class="stat-value muted" id="stat-evaluated">—</span>
    </div>
  </div>

  <section class="log-section" aria-label="Live logs">
    <div class="log-header">
      <h2>Live logs</h2>
      <div class="log-controls">
        <label class="log-toggle">
          <input type="checkbox" id="hide-cron-noise" checked>
          Verberg cron-ruis
        </label>
        <button class="btn-ghost" type="button" id="clear-logs">Wissen</button>
      </div>
    </div>
    <div class="log-box" id="log"></div>
  </section>

  <h2 class="section-title">Aankomende wedstrijden</h2>
  <div id="matches">Laden...</div>

  <script>
    const logBox = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const matchesEl = document.getElementById('matches');
    const hideCronNoiseEl = document.getElementById('hide-cron-noise');
    const authBtn = document.getElementById('auth-btn');

    const CRON_NOISE_PATTERNS = [
      /geen aankomende wedstrijden gevonden/i,
      /skipping overlapping automatic prediction/i,
      /skipping .+: already predicted in this session/i
    ];

    const matchState = new Map();

    function escapeHtml(text) {
      return String(text ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatCountdown(minutes) {
      if (minutes >= 120) {
        const hours = Math.floor(minutes / 60);
        const mins = minutes % 60;
        return mins > 0 ? `Over ${hours} u ${mins} min` : `Over ${hours} u`;
      }
      if (minutes >= 60) return 'Over 1 u';
      if (minutes <= 0) return 'Binnenkort';
      return `Over ${minutes} min`;
    }

    function formatAutoPredictAt(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleString('nl-BE', {
        day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
      });
    }

    function buildStatusChips(match, predicting) {
      const chips = [];
      if (predicting) {
        chips.push('<span class="chip chip-loading">Bezig…</span>');
      } else if (match.submitted) {
        chips.push('<span class="chip chip-done">Ingediend</span>');
      } else if (match.autoPredictScheduled) {
        chips.push('<span class="chip chip-auto">Auto gepland</span>');
      }
      if (!predicting && match.minutesUntilStart != null) {
        chips.push(`<span class="chip chip-time">${escapeHtml(formatCountdown(match.minutesUntilStart))}</span>`);
      }
      if (match.autoPredictScheduled && match.autoPredictAt) {
        chips.push(`<span class="chip chip-time">Auto ~${escapeHtml(formatAutoPredictAt(match.autoPredictAt))}</span>`);
      }
      return chips.join('');
    }

    function renderMatchCardContent(match, predicting) {
      const state = matchState.get(Number(match.matchId)) || {};
      const homeScore = state.homeScore ?? match.currentHomeScore;
      const awayScore = state.awayScore ?? match.currentAwayScore;
      const hasScore = Number.isInteger(homeScore) && Number.isInteger(awayScore);
      const scoreText = hasScore ? `Huidig: ${homeScore} - ${awayScore}` : 'Nog geen voorspelling';

      const startTime = new Date(match.startTime).toLocaleString('nl-BE', {
        day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
      });

      const reasoningHtml = state.reasoning
        ? `<div class="match-reasoning"><strong>Analyse:</strong> ${escapeHtml(state.reasoning)}</div>`
        : '';

      const buttonLabel = predicting
        ? '<span class="spinner" aria-hidden="true"></span> Bezig…'
        : '🔮 Voorspel';

      const loadingMsg = predicting
        ? '<div class="loading-msg">Bezig… (kan 1–2 min duren)</div>'
        : '';

      return `
        <div class="match-header">
          <div class="match-teams">${escapeHtml(match.homeTeam)} vs ${escapeHtml(match.awayTeam)}</div>
          <div class="chip-row">${buildStatusChips(match, predicting)}</div>
          <div class="match-meta">${escapeHtml(match.phaseName || '')} • ${escapeHtml(startTime)}</div>
        </div>
        <div class="match-actions">
          <div class="match-actions-left">
            <div class="match-result" id="score-${match.matchId}">${escapeHtml(scoreText)}</div>
            ${loadingMsg}
            ${reasoningHtml}
          </div>
          <button class="btn-primary predict-btn" type="button" data-match-id="${match.matchId}" ${predicting ? 'disabled' : ''}>
            ${buttonLabel}
          </button>
        </div>
      `;
    }

    function upsertMatchCard(match, predicting = false) {
      const id = Number(match.matchId);
      let card = document.getElementById('match-' + id);
      if (!card) {
        card = document.createElement('div');
        card.className = 'match-card';
        card.id = 'match-' + id;
        matchesEl.appendChild(card);
      }
      card.classList.toggle('predicting', predicting);
      card.innerHTML = renderMatchCardContent(match, predicting);
      card.querySelector('.predict-btn')?.addEventListener('click', () => predictMatch(id));
    }

    function applyPredictionToMatch(data) {
      const matchId = Number(data.matchId);
      matchState.set(matchId, {
        homeScore: data.homeScore,
        awayScore: data.awayScore,
        reasoning: data.reasoning || ''
      });

      const card = document.getElementById('match-' + matchId);
      if (!card) {
        loadMatches();
        return;
      }

      const cached = card.dataset.matchJson ? JSON.parse(card.dataset.matchJson) : { matchId };
      cached.currentHomeScore = data.homeScore;
      cached.currentAwayScore = data.awayScore;
      cached.submitted = true;
      cached.autoPredictScheduled = false;
      card.dataset.matchJson = JSON.stringify(cached);
      upsertMatchCard(cached, false);
    }

    function isCronNoise(message) {
      return CRON_NOISE_PATTERNS.some((pattern) => pattern.test(message));
    }

    function appendLogLine(message, level) {
      const line = document.createElement('div');
      line.className = 'log-line' + (level === 20 ? ' debug' : '');
      line.textContent = message;
      line.dataset.cronNoise = isCronNoise(message) ? '1' : '0';
      if (hideCronNoiseEl.checked && line.dataset.cronNoise === '1') {
        line.classList.add('hidden');
      }
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function refreshLogVisibility() {
      for (const line of logBox.querySelectorAll('.log-line')) {
        if (line.dataset.cronNoise === '1') {
          line.classList.toggle('hidden', hideCronNoiseEl.checked);
        }
      }
    }

    function updateAccuracyBar(stats) {
      const exactEl = document.getElementById('stat-exact');
      const outcomeEl = document.getElementById('stat-outcome');
      const evaluatedEl = document.getElementById('stat-evaluated');

      if (!stats || !stats.evaluated) {
        exactEl.textContent = '—';
        outcomeEl.textContent = '—';
        evaluatedEl.textContent = '—';
        exactEl.classList.add('muted');
        outcomeEl.classList.add('muted');
        evaluatedEl.classList.add('muted');
        return;
      }

      exactEl.textContent = `${stats.exactHits}/${stats.evaluated} (${stats.exactPct}%)`;
      outcomeEl.textContent = `${stats.outcomeHits}/${stats.evaluated} (${stats.outcomePct}%)`;
      evaluatedEl.textContent = String(stats.evaluated);
      exactEl.classList.remove('muted');
      outcomeEl.classList.remove('muted');
      evaluatedEl.classList.remove('muted');
    }

    async function loadAccuracy() {
      try {
        const res = await fetch('/stats/accuracy');
        if (!res.ok) return;
        const stats = await res.json();
        updateAccuracyBar(stats);
      } catch {
        // ignore
      }
    }

    async function loadMatches() {
      try {
        const res = await fetch('/matches/upcoming');
        if (!res.ok) throw new Error('Kon wedstrijden niet laden.');
        const matches = await res.json();
        matchesEl.innerHTML = '';

        if (!matches.length) {
          matchesEl.innerHTML = `
            <div class="empty-state">
              <strong>Geen aankomende wedstrijden</strong>
              Er staan momenteel geen wedstrijden gepland. Kom later terug of controleer de logs.
            </div>
          `;
          return;
        }

        for (const match of matches) {
          const card = document.createElement('div');
          card.className = 'match-card';
          card.id = 'match-' + match.matchId;
          card.dataset.matchJson = JSON.stringify(match);
          card.innerHTML = renderMatchCardContent(match, false);
          card.querySelector('.predict-btn')?.addEventListener('click', () => predictMatch(Number(match.matchId)));
          matchesEl.appendChild(card);
        }
      } catch (err) {
        matchesEl.innerHTML = `<div class="empty-state"><strong>Fout bij laden</strong>${escapeHtml(err.message)}</div>`;
      }
    }

    async function predictMatch(matchId) {
      const card = document.getElementById('match-' + matchId);
      if (!card) return;

      const match = card.dataset.matchJson ? JSON.parse(card.dataset.matchJson) : { matchId };
      upsertMatchCard(match, true);

      try {
        const res = await fetch('/run/predict-match/' + matchId, { method: 'POST' });
        if (!res.ok) {
          const errBody = await res.json().catch(() => ({}));
          throw new Error(errBody.error || 'Voorspelling mislukt.');
        }
        const result = await res.json();
        applyPredictionToMatch(result);
      } catch (err) {
        upsertMatchCard(match, false);
        appendLogLine('❌ Voorspelling mislukt: ' + (err.message || 'onbekende fout'), 30);
      }
    }

    const es = new EventSource('/logs');
    es.onopen = () => { statusEl.textContent = '🟢 Verbonden'; };
    es.onerror = () => { statusEl.textContent = '🔴 Verbinding verbroken'; };
    es.onmessage = (e) => {
      let data;
      try {
        data = JSON.parse(e.data);
      } catch {
        appendLogLine(e.data, 30);
        return;
      }

      if (data.type === 'log') {
        appendLogLine(data.message, data.level ?? 30);
        if (/pronostiek-accuratesse/i.test(data.message)) {
          loadAccuracy();
        }
        if (/pronostiek ingediend|automatische voorspelling voltooid/i.test(data.message)) {
          loadMatches();
        }
        return;
      }

      if (data.type === 'prediction') {
        applyPredictionToMatch(data);
        return;
      }

      if (data.type === 'accuracy') {
        updateAccuracyBar(data);
      }
    };

    async function triggerAuthRefresh() {
      authBtn.disabled = true;
      try {
        await fetch('/run/auth-refresh', { method: 'POST' });
      } finally {
        setTimeout(() => { authBtn.disabled = false; }, 1500);
      }
    }

    hideCronNoiseEl.addEventListener('change', refreshLogVisibility);
    document.getElementById('clear-logs').addEventListener('click', () => { logBox.innerHTML = ''; });
    authBtn.addEventListener('click', triggerAuthRefresh);

    loadMatches();
    loadAccuracy();
    setInterval(loadMatches, 5 * 60 * 1000);
    setInterval(loadAccuracy, 5 * 60 * 1000);
  </script>
</body>
</html>
